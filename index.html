<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#12343B">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Atlas KPI Review</title>
  <meta name="description" content="Atlas Maharani Group - weekly KRA and KPI review for the Monday HOD meeting">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Manrope:wght@400;500;600;700&family=Noto+Sans+Malayalam:wght@400;600&display=swap">
</head>
<body>
  <header class="bar" id="bar" hidden>
    <div class="wrap bar-row">
      <div class="brand"><span>Atlas Maharani Group</span><b>Weekly KPI Review</b><em id="pageTitle"></em></div>
      <button class="menu-btn" id="menuBtn" aria-label="Menu" aria-expanded="false" aria-controls="drawer"><span></span><span></span><span></span></button>
      <div class="week" role="group" aria-label="Review week">
        <button id="wkPrev" aria-label="Previous week">&lsaquo;</button>
        <div class="wl"><b id="wkMeet">Meeting</b><small id="wkRange">Week</small></div>
        <button id="wkNext" aria-label="Next week">&rsaquo;</button>
      </div>
      <div class="bar-actions">
        <span class="role" id="roleChip"></span>
        <button class="btn primary" id="pptBtn">Make PPT</button>
        <button class="btn ghost small" id="myPw">Password</button>
        <button class="btn ghost small" id="signOut">Sign out</button>
      </div>
    </div>
    <nav class="tabs wrap" id="tabs" aria-label="Sections">
      <button data-tab="overview">Overview</button>
      <button data-tab="submit">Results</button>
      <button data-tab="files">File check</button>
      <button data-tab="weekly">Weekly KPI list</button>
      <button data-tab="master">KRA &amp; KPI</button>
      <button data-tab="pending">Pending points</button>
      <button data-tab="md">MD Office</button>
      <button data-tab="users">Users</button>
      <button data-tab="settings">Settings</button>
    </nav>
  </header>
  <div class="drawer-bg" id="drawerBg" hidden></div>
  <aside class="drawer" id="drawer" aria-label="Menu" aria-hidden="true">
    <div class="drawer-head"><div><b id="dName">—</b><span id="dRole"></span></div><button class="btn small ghost" id="drawerClose" aria-label="Close menu">✕</button></div>
    <div class="drawer-week"><button class="btn small" id="dPrev" aria-label="Previous week">‹</button><div><b id="dMeet">Meeting</b><small id="dRange"></small></div><button class="btn small" id="dNext" aria-label="Next week">›</button></div>
    <nav class="drawer-nav" id="dTabs"></nav>
    <div class="drawer-actions">
      <button class="btn primary" id="dPpt">Make PPT</button>
      <button class="btn" id="dPw">🔑 Change password</button>
      <button class="btn ghost danger" id="dOut">Sign out</button>
    </div>
  </aside>
  <main class="wrap" id="main"><div class="empty">Loading…</div></main>
  <div id="modalRoot"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
